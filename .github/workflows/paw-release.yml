name: Build Paw installers
on:
  push:
    tags: ['paw-v0.6.3']
    branches: ['downloads']
    paths: ['.github/workflows/paw-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paw-installers-refs/tags/paw-v0.6.3
  cancel-in-progress: true
jobs:
  configuration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/downloads'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Installer workflow updated; existing release assets are preserved."
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: paw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: paw/package-lock.json
      - run: npm ci
      - run: npm test
      - if: matrix.target == 'win'
        run: npm run dist:win
      - if: matrix.target == 'mac'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Paw-${{ matrix.target }}
          compression-level: 0
          path: |
            paw/release/*.zip
            paw/release/*Setup.exe
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: paw-v0.6.3
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving published installers."
          else
            gh release create "$TAG" artifacts/* --verify-tag --prerelease --title "Paw 0.6.3" --notes-file paw/RELEASE-0.6.3.md
          fi
