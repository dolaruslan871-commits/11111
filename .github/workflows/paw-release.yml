name: Build Paw installers
on:
  push:
    tags: ['paw-v*']
    branches: ['downloads']
    paths: ['.github/workflows/paw-release.yml']
  workflow_dispatch:
concurrency:
  group: paw-installers
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: paw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/paw-v') && github.ref || 'refs/tags/paw-v0.5.1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: paw/package-lock.json
      - run: npm ci
      - run: npm run vendor
      - run: npm test
      - if: matrix.target == 'mac'
        name: Verify live weather endpoint
        run: node scripts/weather-live.cjs
      - if: matrix.target == 'win'
        run: npm run dist:win
      - if: matrix.target == 'mac'
        run: npm exec -- electron-builder --mac zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Paw-${{ matrix.target }}
          compression-level: 0
          path: |
            paw/release/*.zip
            paw/release/*Setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/paw-v') || github.ref == 'refs/heads/downloads'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/paw-v') && github.ref || 'refs/tags/paw-v0.5.1' }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Source archive and checksums
        run: |
          git archive --format=zip --prefix=Paw-0.5.1/ HEAD:paw > artifacts/Paw-0.5.1-source.zip
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/paw-v') && github.ref_name || 'paw-v0.5.1' }}
        run: gh release create "$TAG" artifacts/* --verify-tag --prerelease --title "Paw 0.5 · Play, grow & capture" --notes-file paw/RELEASE_NOTES.md
